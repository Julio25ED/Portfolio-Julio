<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Julio Eduardo — Full Stack Developer</title>
  <meta name="description"
    content="Portfólio de Julio Eduardo, Desenvolvedor Full Stack em Goiânia. Construo e mantenho aplicações web em produção com Vue.js, Node.js e TypeScript." />
  <meta name="author" content="Julio Eduardo" />
  <meta name="theme-color" content="#080808" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Julio Eduardo — Full Stack Developer" />
  <meta property="og:description"
    content="Construo e mantenho aplicações web em produção — estáveis, escaláveis e bem estruturadas." />
  <meta property="og:url" content="https://julio25ed.github.io/Portfolio-Julio/" />
  <meta property="og:image" content="https://julio25ed.github.io/Portfolio-Julio/assets/img/eu2.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Tema aplicado antes da primeira pintura, para não piscar a cor errada -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('juliodev-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/navbar.css" />

  <link rel="icon" href="./assets/icons/fav_icon.png" />
</head>

<body>
  <!-- Fundo fixo: grade com máscara, glow do cursor e glow ambiente -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__cursor"></div>
    <div class="bg__glow" data-drift="3"></div>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="progress__bar" data-progress></div>
  </div>

  <nav class="nav" aria-label="Navegação principal">
    <div class="nav__inner">
      <a class="nav__logo" href="#home">
        <span class="nav__logo-dot" aria-hidden="true"></span>JulioDev
      </a>
      <a class="nav__link" href="#sobre">Sobre</a>
      <a class="nav__link" href="#stack">Skills</a>
      <a class="nav__link" href="#experiencia">Experiência</a>
      <a class="nav__link" href="#projetos">Projetos</a>
      <a class="nav__link" href="#contato">Contato</a>
      <button class="nav__theme" type="button" data-theme-toggle aria-label="Ativar tema claro">
        <i class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

  <main>
    <section class="hero" id="home"></section>

    <section class="section about" id="sobre"></section>

    <section class="section skills" id="stack"></section>

    <section class="section experience" id="experiencia"></section>

    <section class="section projects" id="projetos"></section>

    <section class="section contact" id="contato"></section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>© 2026 Julio Eduardo · Todos os direitos reservados.</span>
      <div class="footer__links">
        <a href="https://github.com/Julio25ED" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/juliodev25/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="./js/theme.js"></script>
</body>

</html>
